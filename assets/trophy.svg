<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1c"/>
    </linearGradient>
    <linearGradient id="basePlinth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3440"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Starburst behind cup -->
  <circle cx="250" cy="200" r="160" fill="#ffd700" opacity="0.12" filter="url(#goldGlow)"/>

  <!-- Left Handle -->
  <path d="M 160 140 C 90 140, 90 260, 175 270" stroke="url(#goldCup)" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Right Handle -->
  <path d="M 340 140 C 410 140, 410 260, 325 270" stroke="url(#goldCup)" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Main Cup Body -->
  <path d="M 150 110 L 350 110 C 350 240, 300 300, 250 310 C 200 300, 150 240, 150 110 Z" fill="url(#goldCup)"/>

  <!-- Rim Highlight -->
  <ellipse cx="250" cy="110" rx="100" ry="18" fill="#fff4b8"/>
  <ellipse cx="250" cy="112" rx="94" ry="14" fill="#d4af37"/>

  <!-- Stem -->
  <path d="M 230 310 L 270 310 L 265 370 L 235 370 Z" fill="url(#goldCup)"/>
  <rect x="220" y="370" width="60" height="15" rx="3" fill="#fff4b8"/>

  <!-- Heavy Marble Plinth Base -->
  <path d="M 170 385 L 330 385 L 350 440 L 150 440 Z" fill="url(#basePlinth)"/>
  
  <!-- Inscribed Plate -->
  <rect x="185" y="398" width="130" height="30" rx="3" fill="#ffd700" stroke="#8a6d1c" stroke-width="1.5"/>
  <text x="250" y="418" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" fill="#2c3440" text-anchor="middle" letter-spacing="1">SUPERR XI</text>

  <!-- Crown Stars -->
  <polygon points="250,55 255,70 270,70 258,80 262,95 250,85 238,95 242,80 230,70 245,70" fill="#ffd700" filter="url(#goldGlow)"/>
</svg>
