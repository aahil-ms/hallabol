<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky & Stadium Ambience -->
    <radialGradient id="stadiumDome" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a0740" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#160829" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#080e29" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040d" stop-opacity="1"/>
    </radialGradient>

    <!-- Floodlight Tower Beams -->
    <linearGradient id="beamL" x1="0%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ea1a85" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#001a42" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamR" x1="100%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#ea1a85" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#001a42" stop-opacity="0"/>
    </linearGradient>

    <!-- Turf Grass Gradient -->
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3d1c" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#082912" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020d06" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Stadium Sky Base -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#stadiumDome)"/>

  <!-- Stadium Roof Arch Truss Silhouettes -->
  <path d="M 0 180 Q 960 40 1920 180 L 1920 220 Q 960 80 0 220 Z" fill="#0d1527" opacity="0.6"/>
  <path d="M 0 240 Q 960 100 1920 240 L 1920 260 Q 960 120 0 260 Z" fill="#0b1021" opacity="0.4"/>

  <!-- Truss Lattice Structure -->
  <g stroke="#ea1a85" stroke-width="1.5" opacity="0.18">
    <line x1="200" y1="170" x2="260" y2="105"/>
    <line x1="260" y1="105" x2="320" y2="160"/>
    <line x1="450" y1="140" x2="510" y2="85"/>
    <line x1="510" y1="85" x2="570" y2="135"/>
    <line x1="750" y1="115" x2="810" y2="65"/>
    <line x1="810" y1="65" x2="870" y2="110"/>
    <line x1="1050" y1="110" x2="1110" y2="65"/>
    <line x1="1110" y1="65" x2="1170" y2="115"/>
    <line x1="1350" y1="135" x2="1410" y2="85"/>
    <line x1="1410" y1="85" x2="1470" y2="140"/>
    <line x1="1600" y1="160" x2="1660" y2="105"/>
    <line x1="1660" y1="105" x2="1720" y2="170"/>
  </g>

  <!-- Massive Left Floodlight Tower (4x3 Bank of Lights) -->
  <g transform="translate(140, 50)" filter="url(#lightGlow)">
    <polygon points="40,250 80,0 120,0 160,250" fill="#050a18" opacity="0.9"/>
    <!-- Lamp Rack Grid -->
    <rect x="50" y="-10" width="100" height="45" rx="4" fill="#030712" stroke="#ffd700" stroke-width="2"/>
    <circle cx="65" cy="5" r="8" fill="#ffffff"/>
    <circle cx="85" cy="5" r="8" fill="#ffffff"/>
    <circle cx="105" cy="5" r="8" fill="#ffffff"/>
    <circle cx="125" cy="5" r="8" fill="#ffffff"/>
    <circle cx="65" cy="22" r="8" fill="#ffffff"/>
    <circle cx="85" cy="22" r="8" fill="#ffffff"/>
    <circle cx="105" cy="22" r="8" fill="#ffffff"/>
    <circle cx="125" cy="22" r="8" fill="#ffffff"/>
  </g>

  <!-- Massive Right Floodlight Tower -->
  <g transform="translate(1600, 50)" filter="url(#lightGlow)">
    <polygon points="40,250 80,0 120,0 160,250" fill="#050a18" opacity="0.9"/>
    <rect x="50" y="-10" width="100" height="45" rx="4" fill="#030712" stroke="#ea1a85" stroke-width="2"/>
    <circle cx="65" cy="5" r="8" fill="#ffffff"/>
    <circle cx="85" cy="5" r="8" fill="#ffffff"/>
    <circle cx="105" cy="5" r="8" fill="#ffffff"/>
    <circle cx="125" cy="5" r="8" fill="#ffffff"/>
    <circle cx="65" cy="22" r="8" fill="#ffffff"/>
    <circle cx="85" cy="22" r="8" fill="#ffffff"/>
    <circle cx="105" cy="22" r="8" fill="#ffffff"/>
    <circle cx="125" cy="22" r="8" fill="#ffffff"/>
  </g>

  <!-- Diagonal Atmospheric Floodlight Beams -->
  <polygon points="240,65 960,650 1400,900 100,500" fill="url(#beamL)" opacity="0.6"/>
  <polygon points="1700,65 960,650 520,900 1820,500" fill="url(#beamR)" opacity="0.6"/>

  <!-- Tiered Stadium Crowd Stands (Silhouette with camera flashes) -->
  <path d="M 0 540 Q 960 480 1920 540 L 1920 780 Q 960 700 0 780 Z" fill="#070b18" opacity="0.85"/>
  <path d="M 0 620 Q 960 560 1920 620 L 1920 840 Q 960 760 0 840 Z" fill="#040711" opacity="0.95"/>

  <!-- Crowd Phone Flashes / Stadium Sparkles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="280" cy="580" r="2"/>
    <circle cx="340" cy="570" r="2.5"/>
    <circle cx="490" cy="550" r="1.8"/>
    <circle cx="620" cy="535" r="2.2"/>
    <circle cx="750" cy="525" r="2"/>
    <circle cx="880" cy="520" r="3" fill="#ea1a85"/>
    <circle cx="1040" cy="520" r="2"/>
    <circle cx="1180" cy="530" r="2.5" fill="#ffd700"/>
    <circle cx="1320" cy="545" r="2"/>
    <circle cx="1480" cy="565" r="2.5"/>
    <circle cx="1620" cy="580" r="2"/>
    <circle cx="1740" cy="600" r="3" fill="#ea1a85"/>
  </g>

  <!-- Lower Oval Turf & Boundary Ropes -->
  <ellipse cx="960" cy="1020" rx="1000" ry="320" fill="url(#turfGrad)"/>
  <!-- Boundary Line Glow -->
  <ellipse cx="960" cy="1020" rx="980" ry="310" fill="none" stroke="#ea1a85" stroke-width="2" opacity="0.3"/>
</svg>
