<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stumpWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="35%" stop-color="#e6af2e"/>
      <stop offset="70%" stop-color="#b87b14"/>
      <stop offset="100%" stop-color="#694005"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Turf Base -->
  <ellipse cx="250" cy="460" rx="220" ry="25" fill="#1b4d24" opacity="0.6"/>

  <!-- Left Stump -->
  <rect x="150" y="160" width="22" height="290" rx="4" fill="url(#stumpWood)"/>
  <rect x="157" y="160" width="8" height="290" fill="url(#neonPink)" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Middle Stump -->
  <rect x="239" y="150" width="22" height="300" rx="4" fill="url(#stumpWood)"/>
  <rect x="246" y="150" width="8" height="300" fill="url(#neonPink)" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Right Stump (Tilted / Knocked Back) -->
  <g transform="rotate(18, 330, 440)">
    <rect x="328" y="160" width="22" height="290" rx="4" fill="url(#stumpWood)"/>
    <rect x="335" y="160" width="8" height="290" fill="url(#neonPink)" opacity="0.8" filter="url(#neonGlow)"/>
  </g>

  <!-- Flying Bail 1 (Electric Zing Bail) -->
  <g transform="translate(190, 80) rotate(-35)">
    <rect x="0" y="0" width="65" height="12" rx="3" fill="#ff007f" filter="url(#neonGlow)"/>
    <circle cx="10" cy="6" r="3" fill="#ffffff"/>
    <circle cx="55" cy="6" r="3" fill="#ffffff"/>
  </g>

  <!-- Flying Bail 2 -->
  <g transform="translate(290, 60) rotate(42)">
    <rect x="0" y="0" width="65" height="12" rx="3" fill="#ffd700" filter="url(#neonGlow)"/>
  </g>

  <!-- Spark Particles -->
  <circle cx="210" cy="110" r="4" fill="#ffd700" filter="url(#neonGlow)"/>
  <circle cx="270" cy="95" r="5" fill="#ff007f" filter="url(#neonGlow)"/>
  <circle cx="340" cy="120" r="3" fill="#00f2fe" filter="url(#neonGlow)"/>
  <circle cx="160" cy="130" r="4" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
