<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3d1c"/>
      <stop offset="100%" stop-color="#07200e"/>
    </linearGradient>
    <linearGradient id="pitchClay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfb076"/>
      <stop offset="50%" stop-color="#dfc590"/>
      <stop offset="100%" stop-color="#c4a569"/>
    </linearGradient>
  </defs>

  <!-- Outfield Grass -->
  <rect x="0" y="0" width="600" height="320" rx="16" fill="url(#grass)"/>
  
  <!-- Outer Crease Circle Accent -->
  <circle cx="300" cy="160" r="140" fill="none" stroke="#256e3b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- The 22 Yards Pitch Strip -->
  <rect x="70" y="90" width="460" height="140" rx="8" fill="url(#pitchClay)" stroke="#eedaa2" stroke-width="2"/>

  <!-- Pitch Length Zones (Visualizing bowling lengths) -->
  <!-- Yorker Zone (Near Batter) -->
  <rect x="80" y="95" width="60" height="130" fill="#ff4b5c" opacity="0.35" rx="4"/>
  <text x="110" y="165" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">YORKER</text>

  <!-- Full Length Zone -->
  <rect x="145" y="95" width="85" height="130" fill="#ff9900" opacity="0.30" rx="4"/>
  <text x="187" y="165" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FULL</text>

  <!-- Good Length Zone (The Corridor of Uncertainty) -->
  <rect x="235" y="95" width="115" height="130" fill="#00e676" opacity="0.35" rx="4"/>
  <text x="292" y="165" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">GOOD LENGTH</text>

  <!-- Back of Length Zone -->
  <rect x="355" y="95" width="85" height="130" fill="#2979ff" opacity="0.30" rx="4"/>
  <text x="397" y="165" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">BACK OF LGTH</text>

  <!-- Short Pitch / Bouncer Zone -->
  <rect x="445" y="95" width="75" height="130" fill="#d500f9" opacity="0.30" rx="4"/>
  <text x="482" y="165" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">SHORT</text>

  <!-- Stumps Batter End -->
  <line x1="85" y1="130" x2="85" y2="190" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="85" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">STRIKER END</text>

  <!-- Stumps Bowler End -->
  <line x1="515" y1="130" x2="515" y2="190" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="515" y="80" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">BOWLER END</text>

  <!-- Popping Creases -->
  <line x1="110" y1="75" x2="110" y2="245" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="490" y1="75" x2="490" y2="245" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Footer Caption -->
  <text x="300" y="285" font-family="sans-serif" font-size="12" font-weight="600" fill="#81c784" text-anchor="middle">🏏 22-YARD T20 PRESSURE DISMISSAL & CONTROL MAP</text>
</svg>
